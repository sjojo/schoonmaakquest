<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SchoonmaakQuest — gamified schoonmaak-tracker</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#15803d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SchoonmaakQuest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
</head>
<body>
  <header class="topbar">
    <div class="brand">🧹 SchoonmaakQuest</div>
    <div class="player">
      <div class="level-badge" id="levelBadge" title="Jouw level">Lv 1</div>
      <div class="xp-wrap">
        <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
        <div class="xp-text" id="xpText">0 / 100 XP</div>
      </div>
      <div class="chip" id="doneTodayChip" title="Klusjes vandaag gedaan">✅ 0 vandaag</div>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-action="tab" data-tab="dashboard" class="tab active">🏠 Dashboard</button>
    <button data-action="tab" data-tab="tasks" class="tab">✅ Taken</button>
    <button data-action="tab" data-tab="rooms" class="tab">🚪 Kamers</button>
    <button data-action="tab" data-tab="badges" class="tab">🏆 Badges</button>
    <button data-action="tab" data-tab="stats" class="tab">📊 Stats</button>
    <button data-action="tab" data-tab="agenda" class="tab">📅 Agenda</button>
    <button data-action="tab" data-tab="settings" class="tab">⚙️ Instellingen</button>
  </nav>

  <main id="main">
    <section id="view-dashboard" class="view"></section>
    <section id="view-tasks" class="view hidden"></section>
    <section id="view-rooms" class="view hidden"></section>
    <section id="view-badges" class="view hidden"></section>
    <section id="view-stats" class="view hidden"></section>
    <section id="view-agenda" class="view hidden"></section>
    <section id="view-settings" class="view hidden"></section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <div id="lock-overlay" class="lock-overlay hidden">
    <div class="lock-card">
      <div class="lock-icon">🧹</div>
      <div class="lock-title">SchoonmaakQuest</div>
      <p class="room-sub">Voer je PIN in om te ontgrendelen</p>
      <form id="lock-form" class="form" style="justify-content:center">
        <input type="password" id="lock-pin" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="PIN" style="max-width:140px;text-align:center" />
        <button type="submit">Ontgrendel</button>
      </form>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
